name: release

# 打 tag 触发：自动编译出 opkg(ipk) 与 apk 两种包，并建 Release。
#
# 为什么要用 CI 编译：OpenWrt 25.12 起包格式是 ADB 容器（魔数 ADBd），
# 无法手工拼装，且 apk 3.0.5 没有 mkpkg 子命令、不接受旧的 v2 tar.gz 包。
# 唯一产出 apk 的方式就是 OpenWrt SDK。放进 CI 后，使用者只需要下载产物。

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

# 0.3.0 起线路体检随包发货：默认 "1"（完整版）。
# 需要剥离版时在这里改成 "0"，并用 FEATURE_LINECHECK=0 重跑一次 CI。
env:
  FEATURE_LINECHECK: "1"

permissions:
  contents: write

jobs:
  # F-21：tag 与版本号必须在编译前对上。打 tag 忘了改 Makefile（或改了版本号
  # 没打 tag）以前不会有任何报错，Release 页写着 v0.3.0、包内自报 0.2.3 也能
  # 一路发出去。这里编译前硬拦；判定实现放在脚本里，本地可以原样复跑。
  version:
    name: tag ↔ 版本一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 断言 tag 的 vX.Y.Z 与 PKG_VERSION / ISP_VERSION 一致
        env:
          TAG_REF: ${{ github.ref }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          case "$TAG_REF" in
            refs/tags/*) sh scripts/verify-release-version.sh "$TAG_NAME" ;;
            *) echo "非 tag 触发（$TAG_REF），跳过 tag↔版本一致性断言（F-21）" ;;
          esac

  build:
    name: build (${{ matrix.branch }})
    needs: [ version ]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 25.12+ 走 apk；24.10 走 opkg(ipk)
          - branch: 25.12.6
          - branch: 24.10.4

    steps:
      - uses: actions/checkout@v4

      - name: 编译（复用 scripts/build-apk.sh，与本地构建同一路径）
        run: sh scripts/build-apk.sh ${{ matrix.branch }} x86/64

      - name: 收集产物
        run: |
          set -eu
          mkdir -p out
          find dist -type f \( -name '*.ipk' -o -name '*.apk' \) -exec cp -v {} out/ \;
          ls -lh out

      # F-22：发货面断言要解 apk（0.3.0 起 apk 进了断言 glob），但 ubuntu runner
      # 上没有 apk-tools 3.x，于是「找不到解包器」直接失败（run 40857244457）。
      # 本地一直是绿的，因为 DSH 直接调 SDK 里的那份 apk；CI 里这份也在——只是
      # 没人告诉断言脚本去哪找。这里把路径算出来注入，verify 与 parity 共用。
      # 路径不许手抄字面量（F7）：build-apk.sh 的 WORK 规则 F-19 起带 $VER 分桶，
      # 手抄的旧路径正好指空。做法是把它那行 WORK 赋值当场抠出来求值。
      - name: 解析 APK_BIN（解包器路径与 build-apk.sh 的 WORK 规则同源）
        run: |
          set -eu
          VER="${{ matrix.branch }}"
          ROOT=$PWD
          # >>> F22-RULE-BEGIN（tools/selftest.sh 22.9 抽这段原样跑，防再次分叉）
          if [ -n "${OWRT_WORK:-}" ]; then
            WORK=$OWRT_WORK
            RULE="OWRT_WORK（显式指定，与 build-apk.sh 同优先级）"
          else
            WORK_RULE=$(sed -n 's/^WORK=${OWRT_WORK:-\(.*\)}$/\1/p' scripts/build-apk.sh | head -1)
            if [ -z "$WORK_RULE" ]; then
              echo "::error::scripts/build-apk.sh 里找不到 WORK=\${OWRT_WORK:-...} 规则，无法同源推导解包器路径"
              exit 1
            fi
            WORK=$(eval "printf '%s' \"$WORK_RULE\"")
            RULE="$WORK_RULE"
          fi
          APK_BIN=$WORK/sdk/staging_dir/host/bin/apk
          # <<< F22-RULE-END
          echo "WORK 规则（取自 scripts/build-apk.sh）: $RULE"
          echo "WORK=$WORK（VER=$VER）"
          echo "APK_BIN=$APK_BIN"
          case "$VER" in
            25.12*)
              # 25.12 job 必须能解 apk：缺失就硬失败，绝不"跳过断言"糊过去。
              [ -x "$APK_BIN" ] || {
                echo "::error::$VER 要解 apk，但 $APK_BIN 不存在或不可执行（WORK 规则漂移？）；拒绝降级为跳过"
                exit 1
              }
              echo "APK_BIN=$APK_BIN" >> "$GITHUB_ENV"
              ;;
            *)
              echo "$VER 产出 ipk，断言不解 apk：不注入 APK_BIN（避免指向不存在的文件）"
              ;;
          esac

      - name: 发货面断言（完整版 feature=1；未知格式显式失败）
        run: |
          set -eu
          # F8：25.12 job 只产 .apk，旧循环 glob 的是 out/*.ipk，于是循环空转、
          # “通过”是假的（run 40827542758 / 40830192705 两次都这样）。
          # 第一步先按分支钉死预期格式，缺了就报错，不允许真空通过。
          case "${{ matrix.branch }}" in
            25.12*) want=apk ;;
            24.10*) want=ipk ;;
            *) echo "::error::未知分支 ${{ matrix.branch }}，无法确定预期包格式"; exit 1 ;;
          esac
          ls out/*."$want" >/dev/null 2>&1 || {
            echo "::error::${{ matrix.branch }} 没有产出 .$want，断言会真空通过"
            exit 1
          }
          # LuCI 包是体检页与 CSS 的唯一载体。它要是没产出，断言就失去覆盖面。
          ls out/luci-app-isp-split* >/dev/null 2>&1 || {
            echo "::error::${{ matrix.branch }} 没有产出 luci-app-isp-split 包，断言面无产物"
            exit 1
          }
          # F-22：apk 容器要用 apk-tools 解包，CI 上唯一可用的是 SDK 里那份，
          # 由上一步按 build-apk.sh 的 WORK 规则解析并注入。没注入就是配置又断了。
          case "$want" in
            apk)
              [ -x "${APK_BIN:-}" ] || {
                echo "::error::${{ matrix.branch }} 发货面断言要解 apk，但 APK_BIN 未注入或不可执行（${APK_BIN:-<空>}）"
                exit 1
              }
              echo "用 APK_BIN=$APK_BIN 解 apk"
              ;;
          esac
          set --
          for f in out/*.ipk out/*.apk; do
            [ -f "$f" ] || continue
            set -- "$@" "$f"
          done
          # 0.3.0 起断言方向反转：不再要求「零残留」，而是要求体检**真的在包里**
          # （linecheck 子命令 / lc-run / linecheck.js 与菜单节点 / CSS `.lc-*` /
          #  conf 的 LINE_CHECK_* / Depends 的 socat）。方向由 --feature 显式给出，
          # 与 env FEATURE_LINECHECK 同源，避免产物与断言各说各话。
          sh scripts/verify-package-payload.sh verify --feature="${FEATURE_LINECHECK}" "$@"

      - name: 脚本路径产物 vs SDK 路径产物 payload 恒等
        run: |
          set -eu
          # 本次教训：本地路径全绿 ≠ SDK 路径绿。同一份源码两条构建路径，
          # payload 必须逐文件一致；不一致就是又分叉了（F7 的本质）。
          # F-22：25.12 job 的 sdk_main 是 .apk，parity 同样要解 apk，所以用同一个
          # 已注入的 APK_BIN（同一处定义，不另算一遍路径）。
          case "${{ matrix.branch }}" in
            25.12*)
              [ -x "${APK_BIN:-}" ] || {
                echo "::error::parity 要解 apk，但 APK_BIN 未注入或不可执行（${APK_BIN:-<空>}）"
                exit 1
              }
              echo "parity 用 APK_BIN=$APK_BIN 解 apk"
              ;;
          esac
          sh scripts/build-ipk.sh
          VER=$(sed -n 's/^PKG_VERSION:=//p' Makefile | head -1)
          REL=$(sed -n 's/^PKG_RELEASE:=//p' Makefile | head -1)
          local_main="dist/isp-split_${VER}-${REL}_all.ipk"
          local_luci="dist/luci-app-isp-split_${VER}-${REL}_all.ipk"
          sdk_main=$(ls out/isp-split* | head -1)
          test -f "$local_main"
          echo "parity main: $sdk_main <-> $local_main"
          sh scripts/verify-package-payload.sh parity "$sdk_main" "$local_main"
          sdk_luci=$(ls out/luci-app-isp-split* | head -1)
          test -f "$local_luci"
          echo "parity luci: $sdk_luci <-> $local_luci"
          sh scripts/verify-package-payload.sh parity "$sdk_luci" "$local_luci"

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.branch }}
          path: out/*
          if-no-files-found: warn

  source:
    name: source tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建分发包
        run: sh scripts/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: dist/*

  release:
    needs: [ build, source ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 汇总
        run: |
          mkdir -p rel
          find artifacts -type f -exec cp -v {} rel/ \;
          # 曾经的 bug：`sha256sum * > SHA256SUMS` 里，重定向先创建空文件，
          # 于是 glob 把 SHA256SUMS 自己也算进去，清单里多出一行
          # `e3b0c442...(空文件的 sha256)  SHA256SUMS`。这里逐个列并显式排除自身。
          cd rel
          : > SHA256SUMS
          for f in *; do
            [ -f "$f" ] || continue
            [ "$f" = "SHA256SUMS" ] && continue
            sha256sum "$f" >> SHA256SUMS 2>/dev/null || shasum -a 256 "$f" >> SHA256SUMS
          done
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS
          # 断言：清单非空，且不含自身
          [ -s SHA256SUMS ] || { echo "::error::SHA256SUMS 为空"; exit 1; }
          if grep -q ' SHA256SUMS$' SHA256SUMS; then
            echo "::error::SHA256SUMS 把自己也列进了清单"
            exit 1
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: rel/*
          # 不自动生成 release notes：0.3.1 的对外口径要人工定稿（换装清单、体检彩蛋、
          # 安装姿势都写在下面手写 body 里），自动 notes 只会把提交标题堆上去。
          generate_release_notes: false
          body: |
            ## v0.3.1-logo 换装更新

            这个版本零逻辑变更，纯换装。分流照旧，改的是你打开仪表盘的心情。

            **换了什么**
            - 三大运营商换上 44px 官方风徽记，卡片头像化：电信蓝牛角 / 联通中国结 / 移动上古互字圆标——扫一眼就知道这月钱是交给谁的
            - 兜底流量卡带着地球图标升格进网格：所有不属于任何运营商的流浪流量，从此和正经线路平起平坐
            - 教育网卡退出默认视图（纯 UI 退场，集合与策略原样健在）：教育网那点 IP 地址，确实不够一张卡呼吸的

            **体检实战彩蛋（真实数据，非摆拍）**
            本版开发期间生产线路跑了一次体检：联通，丢包 40%，评分 C，评语"建议检查光猫/线路质量"。重拨后原地复活满血。结论：北方联通的 PPPoE 会话是量子态——它坏没坏，取决于你看没看它；而体检功能第一次上线就抓着现行，这 40% 丢包它自己都不好意思。
            至于移动：全国移动用户的公网地址挤在几条 CGNAT 段里隔墙喊话，我们移动卡上的条目数至今没凑满两百——不是我们不给镜头，是它家公网真的请不起座。

            ### 安装

            **OpenWrt 25.12+（apk 系，含 Kwrt 25.12）** —— 下载源码包用脚本安装：

            ```sh
            wget -O /tmp/isp.tgz <本页 isp-split-*.tar.gz 的地址>
            mkdir -p /tmp/isp && tar -xzf /tmp/isp.tgz -C /tmp/isp
            sh /tmp/isp/isp-split-0.3.1/scripts/install.sh --all
            ```

            （注意：busybox tar 不支持 --strip-components，所以进目录跑，别抄 GNU 姿势。）

            若本页附带 `.apk`（CI 用 SDK 编译）：

            ```sh
            apk add --no-network --allow-untrusted ./isp-split-*.apk ./luci-app-isp-split-*.apk
            ```

            **OpenWrt 24.10 及以下（opkg 系）**：

            ```sh
            opkg install isp-split_*_all.ipk luci-app-isp-split_*_all.ipk
            ```

            opkg 用户务必重下本页 ipk——0.2.3 起容器格式已对齐官方 gzip-tar，旧版自产 ipk 装不上。
            LuCI 更新后浏览器强刷一次（Ctrl+F5），旧 JS 缓存会让你以为换装失败。
